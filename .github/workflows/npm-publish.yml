name: npm publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example, v1.1.0)"
        required: false
        type: string

concurrency:
  group: npm-publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Extract npm release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            TAG_NAME="${RELEASE_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            echo "Run from a v* tag or provide release_tag, got ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${TAG_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag, got ${TAG_NAME}" >&2
            exit 1
          fi

          VERSION_MAIN="${TAG_NAME#v}"
          BUILD_DATE="$(date +%Y%m%d)"

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_MAIN=${VERSION_MAIN}" >> "$GITHUB_OUTPUT"
          echo "VERSION_BUILD_METADATA=+${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: ./ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate OpenAPI client
        run: |
          go run -tags with_utls . --gen-openapi=./ui/openapi.json
          cd ui
          pnpm run generate-client

      - name: Test build version resolution
        run: python3 -B -m unittest -v test_build_npm_multipackage.py

      - name: Build npm packages
        run: |
          python3 build-npm-multipackage.py \
            --version "${{ steps.version.outputs.VERSION_MAIN }}" \
            --version-build-metadata "${{ steps.version.outputs.VERSION_BUILD_METADATA }}" \
            --app-channel stable

      - name: Publish npm packages
        run: python3 publish-all-packages.py --tag latest
