name: Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve binary version
        id: version
        shell: bash
        run: |
          version_args=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_args+=(--version "${GITHUB_REF#refs/tags/v}")
          else
            version_args+=(--version-prerelease=-dev --app-channel dev)
          fi
          python3 build-npm-multipackage.py "${version_args[@]}" \
            --version-build-metadata="+$(date -u +%Y%m%d)" \
            --print-build-vars >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION_MAIN=${{ steps.version.outputs.VERSION_MAIN }}
            VERSION_PRERELEASE=${{ steps.version.outputs.VERSION_PRERELEASE }}
            VERSION_BUILD_METADATA=${{ steps.version.outputs.VERSION_BUILD_METADATA }}
            APP_CHANNEL=${{ steps.version.outputs.APP_CHANNEL }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
